<!doctype html>
<html lang="en">
  <head>
    <title>B-FIT - Ejercicios</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="styles/authModal.css">
    <link rel="stylesheet" href="styles/ejercicios.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="/"
            ><i class="fa-solid fa-dumbbell"></i> B-FIT</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item nav-exercises">
                <a class="nav-link" href="/ejercicios">Todos los ejercicios</a>
              </li>
              <li class="nav-item nav-calendar">
                <a class="nav-link" href="/calendario">Calendario / Progreso</a>
              </li>
              <li class="nav-item nav-my-routines">
                <a class="nav-link" href="/rutina">Mis rutinas</a>
              </li>
              <li class="nav-item">
                <div id="authButtonsContainer" class="d-flex gap-2"></div>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <div class="container my-5">
      <!-- Filtros -->
      <h2 class="text-center text-primary">Busca tus Ejercicios</h2>
      <div class="row g-3 justify-content-center">
        <div class="col-md-4">
          <label for="filtroMusculo" class="form-label"
            >Selecciona un músculo:</label
          >
          <select id="filtroMusculo" class="form-select">
            <option value="todos">Todos</option>
            <option value="espalda">Espalda</option>
            <option value="pecho">Pecho</option>
            <option value="brazos">Brazos</option>
            <option value="piernas">Piernas</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="filtroNivel" class="form-label"
            >Selecciona el nivel:</label
          >
          <select id="filtroNivel" class="form-select">
            <option value="todos">Todos</option>
            <option value="principiante">Principiante</option>
            <option value="intermedio">Intermedio</option>
            <option value="avanzado">Avanzado</option>
          </select>
        </div>
        <div class="col-md-4 d-flex align-items-end">
          <button
            id="btnBuscar"
            class="btn btn-success w-100"
          >
            Buscar Ejercicios
          </button>
        </div>
      </div>

      <!-- Resultados -->
      <div id="resultados" class="mt-5 row"></div>
    </div>

    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>

    <script src="scripts/toastUtils.js"></script>
    <script src="scripts/ejercicios.js"></script>
    <script src="scripts/authModalHandler.js"></script>
  </body>
</html>
