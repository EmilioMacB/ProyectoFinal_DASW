<!doctype html>
<html lang="en">
    <head>
        <title>Rutina</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
        <!-- FONT AWESOME LINK para poder usar los iconos -->
        <script src="https://kit.fontawesome.com/c88f2a7fc4.js" crossorigin="anonymous"></script>

        <!-- Bootstrap CSS v5.2.1 -->
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"

        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous"
        />
        <link rel="stylesheet" href="styles/rutinaStyles.css">
    </head>

    <body style="background-color: #27292b;">
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <div class="container-fluid">
                  <a class="navbar-brand" href="/"><i class="fa-solid fa-dumbbell"></i> B-FIT</a>
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                  </button>

                  <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                      <li class="nav-item nav-exercises">
                        <a class="nav-link" href="/ejercicios">Todos los ejercicios</a>
                      </li>
                      <li class="nav-item nav-calendar">
                        <a class="nav-link" href="/calendario">Calendario / Progreso</a>
                      </li>
                      <li class="nav-item nav-my-routines">
                        <a class="nav-link" href="/rutina">Mis rutinas</a>
                      </li>
                      <li class="nav-item">
                        <div id="authButtonsContainer" class="d-flex gap-2"></div>
                      </li>
                    </ul>
                  </div>
                </div>
              </nav>
        </header>
        <main>
            <div class="container mt-5">
                <h1 style="color: whitesmoke; margin-bottom: 50px;">Tu rutina de hoy</h1>
                <div class="row">
                    <!-- Contenedor dinámico para la rutina -->
                    <div id="rutinaContainer" class="col-md-8"></div>
        
                    <!-- Contenedor para el progreso -->
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Progreso de ejercicios</h5>
                                <ul id="progressList" class="list-group"></ul>
                                <div class="progress mt-3">
                                    <div class="progress-bar" style="width: 0%;" id="progressBar"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"

        <script src="scripts/rutinaEventHandler.js"></script>
