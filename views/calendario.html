<!doctype html>
<html lang="es">
  <head>
    <title>Racha de calendario</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script
      src="https://kit.fontawesome.com/c88f2a7fc4.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles/styles.css" />
  </head>

  <body style="background-color: #27292b">
    

    <!-- Navbar -->
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="/"
            ><i class="fa-solid fa-dumbbell"></i> B-FIT</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item nav-exercises">
                <a class="nav-link" href="/ejercicios">Todos los ejercicios</a>
              </li>
              <li class="nav-item nav-calendar">
                <a class="nav-link" href="/calendario">Calendario / Progreso</a>
              </li>
              <li class="nav-item nav-my-routines">
                <a class="nav-link" href="/rutina">Mis rutinas</a>
              </li>
              <li class="nav-item">
                <div id="authButtonsContainer" class="d-flex gap-2"></div>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    
    <!-- Modal para asignar rutina -->
    <div id="routineModal" class="modal">
      <div class="modal-content">
        <h3>Selecciona la rutina realizada</h3>
        <select id="routineSelect">
          <option value="Piernas">Piernas</option>
          <option value="Brazo">Brazo</option>
          <option value="Pecho">Pecho</option>
          <option value="Espalda">Espalda</option>
        </select>
        <button id="saveRoutine" class="btn btn-primary">Guardar</button>
      </div>
    </div>

    <main class="container d-flex justify-content-between">
      <section class="calendario-wrapper">
        <h2>Entrenamientos Del Mes</h2>
        <div class="month-navigation">
          <button id="prev" class="arrow">
            <i class="fa fa-arrow-left"></i> Anterior
          </button>
          <p class="current date"></p>
          <button id="next" class="arrow">
            Siguiente <i class="fa fa-arrow-right"></i>
          </button>
        </div>
        <table class="calendario">
          <thead>
            <tr>
              <th>Lu</th>
              <th>Ma</th>
              <th>Mi</th>
              <th>Ju</th>
              <th>Vi</th>
              <th>Sa</th>
              <th>Do</th>
            </tr>
          </thead>
          <tbody class="dias">
            <!-- Días generados dinámicamente -->
          </tbody>
        </table>
      </section>
      <section id="racha">
        <h3>Racha Ejercitándote</h3>
        <div id="streak-content">
          <img
            id="streak-image"
            src="https://i.pinimg.com/736x/f0/f7/55/f0f755c4e38efd7dc0b10ddce9c7d247.jpg"
            alt="Imagen de racha"
          />
          <button id="streak-button">¡0 días consecutivos!</button>
        </div>
      </section>
    </main>
    <script src="scripts/toastUtils.js"></script>
    <script src="scripts/calendarioEventHandler.js"></script>
    <script src="scripts/authModal.js"></script>
  </body>
</html>
